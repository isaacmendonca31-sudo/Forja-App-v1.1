<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FORJA — Diário de treino</title>
  <meta name="description" content="Registro e acompanhamento de treinos de musculação com foco em hipertrofia e progressão de cargas.">
  <meta name="theme-color" content="#0E0F12">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">

  <!--
    Política de Segurança de Conteúdo (CSP):
    • script-src 'self'  → só executa JavaScript do próprio app (nada inline, nada de CDN).
    • style-src 'self'   → sem CSS inline; estilos dinâmicos usam CSSOM.
    • connect-src        → só o próprio app e o Supabase (sincronização opcional).
    • object-src/base-uri 'none' → bloqueia plugins e injeção de <base>.
    Cabeçalhos HTTP equivalentes (mais completos, incluindo frame-ancestors) estão em _headers.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Sprite de ícones (referenciados por <use href="#i-nome">) -->
  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5zM4 19a2 2 0 0 1 2-2h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l2.5 1.5M9 2h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  </svg>

  <a class="skip-link" href="#main">Ir para o conteúdo</a>

  <header class="app-header">
    <a class="brand" href="#/" aria-label="FORJA — início">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8" fill="#FF6B1A"/><path d="M10 7h13v4.2H14.6v3.4H21v4.2h-6.4V25H10z" fill="#0E0F12"/></svg>
      <span class="brand-name">FORJA</span>
    </a>
    <button id="install-app" class="btn primary small install-app" type="button" aria-label="Instalar o FORJA" hidden>Instalar</button>
    <span id="sync-badge" class="sync-badge" hidden></span>
  </header>

  <main id="main" tabindex="-1"></main>

  <!-- Cronômetro de descanso (controlado por js/timer.js) -->
  <div id="rest-timer" class="rest-timer" hidden></div>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="#/" data-route="treino"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-dumbbell"/></svg><span>Treino</span></a>
    <a href="#/evolucao" data-route="evolucao"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chart"/></svg><span>Evolução</span></a>
    <a href="#/historico" data-route="historico"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-history"/></svg><span>Histórico</span></a>
    <a href="#/biblioteca" data-route="biblioteca"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-book"/></svg><span>Biblioteca</span></a>
    <a href="#/ajustes" data-route="ajustes"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-sliders"/></svg><span>Ajustes</span></a>
  </nav>

  <!-- Avisos (leitores de tela anunciam automaticamente) -->
  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <noscript><p class="noscript">O FORJA precisa de JavaScript para funcionar.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
